<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de producto</title>
</head>
<body>

    <h1>Registro de productos</h1>

    <form th:action="@{/productos/guardar}"
          th:object="${producto}" method="post">

        <input type="hidden" th:field="*{id}">

        <label>Nombre:</label>
        <input type="text" th:field="*{nombre}" required>
        <br><br>

        <label>Descripción:</label>
        <input type="text" th:field="*{descripcion}">
        <br><br>

        <label>Precio:</label>
        <input type="number" step="0.01" th:field="*{precio}" required>
        <br><br>

        <label>Cantidad:</label>
        <input type="number" th:field="*{cantidad}" required>
        <br><br>

        <button type="submit">Guardar producto</button>

    </form>

    <br>

    <a th:href="@{/productos}">Volver al inventario</a>

</body>
</html>
